<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Encurtador de URL</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">

<div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full">
    <h1 class="text-2xl font-bold mb-6 text-center text-blue-600">Encurtador de URL</h1>

    <form th:action="@{/encurtar}" method="post" class="space-y-4">
        <input type="url" name="urlOriginal" placeholder="Cole sua URL longa aqui..." required
               class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition">
            Encurtar
        </button>
    </form>

    <div th:if="${urlEncurtada}" class="mt-6 p-4 bg-green-50 border border-green-200 rounded-md">
        <p class="text-sm text-green-700">Sua URL encurtada:</p>
        <a th:href="${urlEncurtada}" th:text="${urlEncurtada}" target="_blank"
           class="text-blue-600 font-bold break-all hover:underline"></a>
    </div>
</div>

</body>
</html>
